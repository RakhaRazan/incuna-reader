  />
  <line x1="49" y1="28.5" x2="43.5" y2="30.6" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="49" y1="34.5" x2="43.5" y2="36.6" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>

