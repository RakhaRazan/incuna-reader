    stroke="#22D3EE"
    stroke-width="2.8"
    stroke-linejoin="round"
  />
  <line x1="15" y1="28.5" x2="20.5" y2="30.6" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="15" y1="34.5" x2="20.5" y2="36.6" stroke="#22D3EE" stroke-opacity="0.6" stroke-width="1.6" stroke-linecap="round"/>

